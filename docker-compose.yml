

services:
  # Customization Point A: Database Service
  db:
    image: pgvector/pgvector:pg16
    container_name: signalrag_db  # <--- Change name here if you rename the project
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d signalrag"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Customization Point B: FastAPI Backend Service
  backend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: signalrag_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/signalrag
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Customization Point C: Streamlit Frontend Service
  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: signalrag_frontend
    restart: always
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend

volumes:
  postgres_data: